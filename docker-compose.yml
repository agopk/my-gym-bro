services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mygymbro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mygymbro
    ports:
      - "5432:5432"
    volumes:
      - mygymbro-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygymbro -d mygymbro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mygymbro-postgres:
